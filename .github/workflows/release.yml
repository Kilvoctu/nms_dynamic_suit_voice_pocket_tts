name: Release (manual build)

# Manual only: builds the Windows onedir zip and publishes it to GitHub Releases.
# Nothing runs on push/PR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 161616)"
        required: true
      notes:
        description: "Release notes"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Fetch build-time tools into state/bin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force state\bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/pas2k/wav2wem/releases/download/v0.1/wav2wem.exe" -OutFile state\bin\wav2wem.exe
          $got = (Get-FileHash state\bin\wav2wem.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne "5a10738a73d5451ede6a526a7aa0bfe7f42b41faffe78c9b62ec9f223f91d736") { throw "wav2wem.exe checksum mismatch: $got" }
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffplay-temp.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\ffplay-temp.zip")
          $entry = $zip.Entries | Where-Object { $_.FullName -eq "ffmpeg-master-latest-win64-lgpl/bin/ffplay.exe" }
          if (-not $entry) { throw "ffplay.exe not found in the zip" }
          [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$PWD\state\bin\ffplay.exe", $true)
          $zip.Dispose()
          Remove-Item ffplay-temp.zip -Force

      - name: Build onedir bundle
        run: python -m PyInstaller NMS_DSV.spec --noconfirm

      - name: Zip release artifact
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $asset = "NMS_DSV-$env:TAG-win64.zip"
          Compress-Archive -Path dist\NMS_DSV -DestinationPath "dist\$asset"
          (Get-FileHash "dist\$asset" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "dist\$asset.sha256"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $asset = "NMS_DSV-$env:TAG-win64.zip"
          $extra = @()
          if ($env:PRERELEASE -eq "true") { $extra += "--prerelease" }
          if ([string]::IsNullOrWhiteSpace($env:NOTES)) { $env:NOTES = "Windows build. Unzip somewhere safe and run DSV.exe; state\ is created beside it on first run." }
          gh release create "$env:TAG" "dist\$asset" "dist\$asset.sha256" --title "NMS Dynamic Suit Voice $env:TAG" --notes "$env:NOTES" @extra
